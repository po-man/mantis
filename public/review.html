<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vector · review</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2330;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --good: #3fb950;
        --bad: #f85149;
        --warn: #d29922;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 24px 12px;
      }
      h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
      h2 { margin: 0; font-size: 16px; }
      p.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      main { padding: 0 24px 32px; }
      button, select, input {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 10px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: #1f6feb; border-color: #1f6feb; }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      .card .value { font-size: 22px; font-weight: 650; margin-top: 2px; }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .filters input { min-width: 150px; }
      .table-wrap {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: auto;
      }
      table { width: 100%; border-collapse: collapse; min-width: 980px; }
      th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
      th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; background: var(--panel-2); position: sticky; top: 0; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: #1b2230; }
      tbody tr:last-child td { border-bottom: 0; }
      .thumb { width: 44px; height: 44px; object-fit: contain; background: conic-gradient(#e0e0e0 25%, #fff 0 50%, #e0e0e0 0 75%, #fff 0) 0 0 / 8px 8px; border-radius: 4px; border: 1px solid var(--border); }
      .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; }
      .badge.success { color: var(--good); background: rgba(63, 185, 80, 0.12); }
      .badge.error { color: var(--bad); background: rgba(248, 81, 73, 0.12); }
      .badge.ds { color: var(--warn); background: rgba(210, 153, 34, 0.12); }
      .muted { color: var(--muted); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .empty { padding: 28px; text-align: center; color: var(--muted); }
      footer.pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding-top: 12px; }
      .prompt-stats { margin: 0 0 14px; }
      .prompt-stats table { min-width: 0; }
      .prompt-stats th, .prompt-stats td { padding: 6px 8px; }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(1, 4, 9, 0.72);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
        overflow: auto;
        z-index: 10;
      }
      .overlay[hidden] { display: none; }
      .panel {
        width: min(1180px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: var(--panel);
        border-radius: 10px 10px 0 0;
        z-index: 1;
      }
      .panel-body { padding: 18px; }
      .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
      .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 800px) { .previews { grid-template-columns: 1fr; } }
      .preview {
        position: relative;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .preview img {
        max-width: 100%;
        max-height: 520px;
        display: block;
        background: conic-gradient(#e0e0e0 25%, #fff 0 50%, #e0e0e0 0 75%, #fff 0) 0 0 / 16px 16px;
      }
      .preview .placeholder { color: #57606a; padding: 20px; text-align: center; }
      .preview-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 6px; }
      .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .preview-head .preview-label { margin: 0; }
      .preview-actions { display: flex; gap: 6px; }
      .preview-actions button { padding: 3px 9px; font-size: 12px; }
      .preview-interactive { padding: 0; }
      .parallax-stage {
        width: min(100%, 520px);
        aspect-ratio: 1;
        background: conic-gradient(#e0e0e0 25%, #fff 0 50%, #e0e0e0 0 75%, #fff 0) 0 0 / 16px 16px;
        cursor: crosshair;
        touch-action: none;
      }
      .parallax-stage.checkerboard-dark {
        background: conic-gradient(#3a4048 25%, #22272e 0 50%, #3a4048 0 75%, #22272e 0) 0 0 / 16px 16px;
      }
      .parallax-stage svg { display: block; width: 100%; height: 100%; }
      .parallax-hint {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(13, 17, 23, 0.72);
        color: #fff;
        font-size: 12px;
        pointer-events: none;
        transition: opacity 180ms ease;
        white-space: nowrap;
      }
      .parallax-hint.hidden { opacity: 0; }
      .parallax-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 520px;
        aspect-ratio: 1;
        color: #57606a;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        margin: 0 auto;
      }
      .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 16px 0; }
      .metric { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
      .metric .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
      .metric .v { font-weight: 600; margin-top: 1px; }
      details { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 12px; background: var(--panel-2); }
      summary { cursor: pointer; font-weight: 600; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 10px 0 0; max-height: 420px; overflow: auto; }
      .warnings { margin: 8px 0 0; padding-left: 20px; color: var(--warn); }
      .calls { margin-top: 10px; }
      .calls table { min-width: 0; }
      .calls th, .calls td { padding: 6px 8px; }
      .error-box { color: var(--bad); background: rgba(248, 81, 73, 0.08); border: 1px solid rgba(248, 81, 73, 0.3); border-radius: 6px; padding: 10px 12px; margin-top: 12px; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>vector · review</h1>
        <p class="sub">Inspect conversion inputs, SVG outputs, prompts, and LLM metrics.</p>
      </div>
      <button id="refresh" class="primary">Refresh</button>
    </header>

    <main>
      <section class="stats" id="stats"></section>
      <section class="prompt-stats" id="prompt-stats"></section>

      <section class="filters">
        <select id="status">
          <option value="">All statuses</option>
          <option value="success">Success</option>
          <option value="error">Error</option>
        </select>
        <input id="model" placeholder="Model" />
        <input id="promptVersion" placeholder="Prompt version" />
        <input id="q" placeholder="Search request id / model / prompt" />
        <button id="apply" class="primary">Apply</button>
        <button id="reset">Reset</button>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID / time</th>
              <th>Status</th>
              <th>Input</th>
              <th>Dimensions</th>
              <th>Model</th>
              <th>Prompt</th>
              <th>Attempts</th>
              <th>Latency</th>
              <th>Tokens</th>
              <th>SVG</th>
              <th>Warnings</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden>No conversions recorded yet.</div>
      </section>

      <footer class="pager">
        <span id="page" class="muted"></span>
        <button id="prev">Prev</button>
        <button id="next">Next</button>
      </footer>
    </main>

    <div id="overlay" class="overlay" hidden>
      <div class="panel">
        <div class="panel-head">
          <h2 id="detail-title">Conversion</h2>
          <button id="close">Close</button>
        </div>
        <div class="panel-body" id="detail-body"></div>
      </div>
    </div>

    <script>
      const state = { limit: 25, offset: 0, total: 0, filters: {}, items: [], currentId: null };
      let detailRequest = 0;

      const $ = (id) => document.getElementById(id);

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function fmtNum(value) {
        return Number(value ?? 0).toLocaleString();
      }

      function fmtMs(value) {
        const ms = Number(value ?? 0);
        return ms >= 1000 ? (ms / 1000).toFixed(2) + " s" : Math.round(ms) + " ms";
      }

      function fmtBytes(value) {
        const bytes = Number(value ?? 0);
        if (!bytes) return "—";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KiB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MiB";
      }

      function fmtDate(value) {
        if (!value) return "—";
        return new Date(Number(value)).toLocaleString();
      }

      function statusBadge(status) {
        return '<span class="badge ' + escapeHtml(status) + '">' + escapeHtml(status) + "</span>";
      }

      async function api(path) {
        const response = await fetch(path, { headers: { accept: "application/json" } });
        if (!response.ok) {
          let message = response.status + " " + response.statusText;
          try {
            const body = await response.json();
            message = body?.error?.message || message;
          } catch {}
          throw new Error(message);
        }
        return response.json();
      }

      function renderStats(stats) {
        const cards = [
          ["Conversions", fmtNum(stats.total)],
          ["Success rate", (Number(stats.successRate ?? 0) * 100).toFixed(1) + "%"],
          ["Avg latency", fmtMs(stats.avgLatencyMs)],
          ["Total tokens", fmtNum(stats.totalTokens)],
          ["Avg tokens", fmtNum(Math.round(stats.avgTokens ?? 0))],
          ["Downsampled", fmtNum(stats.downsampled)],
        ];
        $("stats").innerHTML = cards
          .map(
            ([label, value]) =>
              '<div class="card"><div class="label">' + escapeHtml(label) +
              '</div><div class="value">' + escapeHtml(value) + "</div></div>",
          )
          .join("");

        const prompts = stats.prompts || [];
        if (prompts.length === 0) {
          $("prompt-stats").innerHTML = "";
          return;
        }
        $("prompt-stats").innerHTML =
          '<div class="table-wrap"><table><thead><tr>' +
          "<th>Prompt version</th><th>Total</th><th>Success</th><th>Errors</th>" +
          "<th>Avg latency</th><th>Avg tokens</th></tr></thead><tbody>" +
          prompts
            .map(
              (prompt) =>
                "<tr><td class=\"mono\">" + escapeHtml(prompt.version) +
                "</td><td>" + fmtNum(prompt.total) +
                "</td><td>" + fmtNum(prompt.successes) +
                "</td><td>" + fmtNum(prompt.errors) +
                "</td><td>" + escapeHtml(fmtMs(prompt.avgLatencyMs)) +
                "</td><td>" + fmtNum(Math.round(prompt.avgTokens ?? 0)) +
                "</td></tr>",
            )
            .join("") +
          "</tbody></table></div>";
      }

      function renderRows(items) {
        $("empty").hidden = items.length > 0;
        $("rows").innerHTML = items
          .map((item) => {
            const thumb = item.hasInput
              ? '<img class="thumb" loading="lazy" src="/review/api/conversions/' +
                item.id + '/input" alt="input" />'
              : '<span class="muted">—</span>';
            const dims = item.inputWidth
              ? item.inputWidth + "×" + item.inputHeight
              : "—";
            const original = item.originalWidth
              ? item.originalWidth + "×" + item.originalHeight
              : "—";
            const ds = item.downsampled
              ? ' <span class="badge ds">DS</span>'
              : "";
            const svg = item.outputBytes
              ? fmtBytes(item.outputBytes) + " · " + fmtNum(item.svgPaths) + " paths"
              : "—";
            return (
              '<tr data-id="' + item.id + '">' +
              "<td><div class=\"mono\">#" + item.id + "</div><div class=\"muted\">" +
              escapeHtml(fmtDate(item.createdAt)) + "</div></td>" +
              "<td>" + statusBadge(item.status) + "</td>" +
              "<td>" + thumb + "</td>" +
              "<td><div>" + escapeHtml(dims) + ds + "</div><div class=\"muted\">from " +
              escapeHtml(original) + "</div></td>" +
              "<td class=\"mono\">" + escapeHtml(item.model || "—") + "</td>" +
              "<td class=\"mono\">" + escapeHtml(item.promptVersion) + "</td>" +
              "<td>" + fmtNum(item.attempts) + "</td>" +
              "<td>" + escapeHtml(fmtMs(item.latencyMs)) + "</td>" +
              "<td>" + fmtNum(item.totalTokens) + "</td>" +
              "<td>" + escapeHtml(svg) + "</td>" +
              "<td>" + fmtNum(item.warningCount) + "</td>" +
              "</tr>"
            );
          })
          .join("");

        for (const row of $("rows").querySelectorAll("tr")) {
          row.addEventListener("click", () => openDetail(Number(row.dataset.id)));
        }
      }

      function metric(label, value) {
        return (
          '<div class="metric"><div class="k">' + escapeHtml(label) +
          '</div><div class="v">' + escapeHtml(value) + "</div></div>"
        );
      }

      function renderCalls(calls) {
        if (!calls || calls.length === 0) {
          return '<p class="muted">No per-call metrics recorded.</p>';
        }
        return (
          '<div class="calls"><table><thead><tr>' +
          "<th>Attempt</th><th>Model</th><th>Latency</th><th>Prompt</th>" +
          "<th>Completion</th><th>Total</th><th>Finish</th><th>Chars</th>" +
          "</tr></thead><tbody>" +
          calls
            .map(
              (call) =>
                "<tr><td>" + fmtNum(call.attempt) +
                "</td><td class=\"mono\">" + escapeHtml(call.model) +
                "</td><td>" + escapeHtml(fmtMs(call.latencyMs)) +
                "</td><td>" + fmtNum(call.promptTokens) +
                "</td><td>" + fmtNum(call.completionTokens) +
                "</td><td>" + fmtNum(call.totalTokens) +
                "</td><td>" + escapeHtml(call.finishReason || "—") +
                "</td><td>" + fmtNum(call.contentLength) +
                "</td></tr>",
            )
            .join("") +
          "</tbody></table></div>"
        );
      }

      // ---------------------------------------------------------------------
      // Interactive parallax player
      // Keep the evaluator in sync with src/services/parallax.ts.
      // ---------------------------------------------------------------------

      let parallaxPlayer = null;
      let darkCheckerboard = false;

      function destroyParallax() {
        if (parallaxPlayer) {
          parallaxPlayer.destroy();
          parallaxPlayer = null;
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function formatMotion(value) {
        const rounded = Math.round(value * 10000) / 10000;
        return Object.is(rounded, -0) ? "0" : String(rounded);
      }

      function evaluateParallaxMotion(node, cursor, viewBox, multipliers) {
        const cx = (cursor.x - 0.5) * 2;
        const cy = (cursor.y - 0.5) * 2;
        const shift = multipliers.shift;
        const scaleMultiplier = multipliers.scale;
        const rotateMultiplier = multipliers.rotate;

        const tx =
          node.translate.x.const +
          (node.translate.x.cx * cx + node.translate.x.cy * cy) * shift;
        const ty =
          node.translate.y.const +
          (node.translate.y.cx * cx + node.translate.y.cy * cy) * shift;

        const viewX = viewBox[0];
        const viewY = viewBox[1];
        const viewWidth = viewBox[2];
        const viewHeight = viewBox[3];
        const pivotX = (node.pivot[0] - viewX) / viewWidth;
        const pivotY = (node.pivot[1] - viewY) / viewHeight;
        const distance =
          Math.hypot(cursor.x - pivotX, cursor.y - pivotY) / Math.SQRT2;
        const radius = node.scale.radius || 0;
        const proximity =
          radius > 0
            ? Math.exp(-((distance / radius) ** 2)) - (node.scale.neutral || 0)
            : 0;
        const scaleDelta =
          node.scale.cx * cx +
          node.scale.cy * cy +
          node.scale.proximity * proximity;
        const scale = node.scale.const + scaleDelta * scaleMultiplier;
        const rotate =
          node.rotate.const +
          (node.rotate.cx * cx + node.rotate.cy * cy) * rotateMultiplier;

        return { tx: tx, ty: ty, scale: scale, rotate: rotate };
      }

      // Keep in sync with evaluateOscillator() in src/services/parallax.ts.
      function evaluateOscillator(oscillator, time) {
        const period = Math.max(0.1, oscillator.period);
        const shifted = time + oscillator.phase * period;
        const local = ((shifted % period) + period) % period;

        switch (oscillator.wave) {
          case "sine": {
            const value = Math.sin((2 * Math.PI * shifted) / period);
            const initial = Math.sin(2 * Math.PI * oscillator.phase);
            return (value - initial) * oscillator.amplitude;
          }
          case "pulse": {
            const width = Math.max(0.001, (oscillator.duty || 0.1) * period);
            if (local > width) return 0;
            const u = local / width;
            return Math.sin(Math.PI * u) ** 2 * oscillator.amplitude;
          }
          case "bounce": {
            const width = Math.max(0.001, (oscillator.duty || 0.35) * period);
            if (local > width) return 0;
            const u = local / width;
            return Math.sin(Math.PI * u) * oscillator.amplitude;
          }
          case "twitch": {
            const width = Math.max(0.001, (oscillator.duty || 0.12) * period);
            if (local > width) return 0;
            const u = local / width;
            const decay = oscillator.decay || 4;
            return (
              Math.exp(-decay * u) *
              Math.sin(2 * Math.PI * 2 * u) *
              oscillator.amplitude
            );
          }
        }
        return 0;
      }

      // Keep in sync with evaluateIdleNode() in src/services/parallax.ts.
      function evaluateIdleMotion(node, time) {
        const idle = node.idle;
        if (!idle) {
          return { tx: 0, ty: 0, scaleX: 1, scaleY: 1, rotate: 0 };
        }
        const tx = idle.translate && idle.translate.x
          ? evaluateOscillator(idle.translate.x, time)
          : 0;
        const ty = idle.translate && idle.translate.y
          ? evaluateOscillator(idle.translate.y, time)
          : 0;
        const sx = idle.scale && idle.scale.x
          ? evaluateOscillator(idle.scale.x, time)
          : 0;
        const sy = idle.scale && idle.scale.y
          ? evaluateOscillator(idle.scale.y, time)
          : 0;
        const rotate = idle.rotate ? evaluateOscillator(idle.rotate, time) : 0;
        return {
          tx: tx,
          ty: ty,
          scaleX: 1 + sx,
          scaleY: 1 + sy,
          rotate: rotate,
        };
      }

      // Keep in sync with combineMotions() in src/services/parallax.ts.
      function combineMotions(parallax, idle) {
        return {
          tx: parallax.tx + idle.tx,
          ty: parallax.ty + idle.ty,
          scale: parallax.scale,
          scaleX: parallax.scale * idle.scaleX,
          scaleY: parallax.scale * idle.scaleY,
          rotate: parallax.rotate + idle.rotate,
        };
      }

      function transformForMotion(node, motion, correction) {
        const dx = correction ? correction.dx : 0;
        const dy = correction ? correction.dy : 0;
        const scaleX = motion.scaleX === undefined ? motion.scale : motion.scaleX;
        const scaleY = motion.scaleY === undefined ? motion.scale : motion.scaleY;
        const scale = scaleX === scaleY
          ? "scale(" + formatMotion(scaleX) + ")"
          : "scale(" + formatMotion(scaleX) + " " + formatMotion(scaleY) + ")";
        return (
          "translate(" + formatMotion(motion.tx + dx) + " " + formatMotion(motion.ty + dy) + ") " +
          "translate(" + formatMotion(node.pivot[0]) + " " + formatMotion(node.pivot[1]) + ") " +
          "rotate(" + formatMotion(motion.rotate) + ") " +
          scale + " " +
          "translate(" + formatMotion(-node.pivot[0]) + " " + formatMotion(-node.pivot[1]) + ")"
        );
      }

      // Keep in sync with nodePoint() in src/services/parallax.ts.
      function nodePoint(node, motion, point, correction) {
        const radians = (motion.rotate * Math.PI) / 180;
        const cos = Math.cos(radians);
        const sin = Math.sin(radians);
        const pivotX = node.pivot[0];
        const pivotY = node.pivot[1];
        const dx = point[0] - pivotX;
        const dy = point[1] - pivotY;
        const scaleX = motion.scaleX === undefined ? motion.scale : motion.scaleX;
        const scaleY = motion.scaleY === undefined ? motion.scale : motion.scaleY;
        const scaledX = scaleX * dx;
        const scaledY = scaleY * dy;
        return [
          pivotX + motion.tx + (correction ? correction.dx : 0) +
            cos * scaledX - sin * scaledY,
          pivotY + motion.ty + (correction ? correction.dy : 0) +
            sin * scaledX + cos * scaledY,
        ];
      }

      // Keep in sync with resolveAnchorCorrections() in src/services/parallax.ts.
      function resolveAnchorCorrections(rig, motions) {
        const corrections = new Map();
        for (const node of rig.nodes) {
          corrections.set(node.id, { dx: 0, dy: 0 });
        }
        const anchors = rig.anchors || [];
        if (anchors.length === 0) return corrections;

        const nodeById = new Map();
        for (const node of rig.nodes) nodeById.set(node.id, node);

        const byMember = new Map();
        for (const anchor of anchors) {
          for (const member of anchor.members) {
            const list = byMember.get(member.node) || [];
            list.push(anchor);
            byMember.set(member.node, list);
          }
        }

        const resolved = new Set();
        const resolving = new Set();
        function resolve(id) {
          if (resolved.has(id) || resolving.has(id)) return;
          resolving.add(id);
          const node = nodeById.get(id);
          const motion = motions.get(id);
          if (node && motion) {
            const nodeAnchors = byMember.get(id) || [];
            let sumX = 0;
            let sumY = 0;
            let count = 0;
            for (const anchor of nodeAnchors) {
              resolve(anchor.host);
              const host = nodeById.get(anchor.host);
              const hostMotion = motions.get(anchor.host);
              let membership = null;
              for (const member of anchor.members) {
                if (member.node === id) membership = member;
              }
              if (!host || !hostMotion || !membership) continue;
              const joint = anchor.point;
              const own = nodePoint(node, motion, joint);
              let targetX = joint[0];
              let targetY = joint[1];
              if (membership.frame === "shared") {
                const hostPoint = nodePoint(
                  host,
                  hostMotion,
                  joint,
                  corrections.get(anchor.host),
                );
                targetX = hostPoint[0];
                targetY = hostPoint[1];
              }
              const weld = typeof node.weld === "number" ? node.weld : 1;
              sumX += (targetX - own[0]) * weld;
              sumY += (targetY - own[1]) * weld;
              count += 1;
            }
            if (count > 0) {
              corrections.set(id, { dx: sumX / count, dy: sumY / count });
            }
          }
          resolving.delete(id);
          resolved.add(id);
        }

        for (const node of rig.nodes) resolve(node.id);
        return corrections;
      }

      function sanitizeSvg(root) {
        const forbidden = new Set([
          "script", "foreignobject", "iframe", "object", "embed", "audio",
          "video", "canvas", "link", "base", "animate", "animatetransform",
          "animatemotion", "set", "handler", "listener",
        ]);
        const elements = [root].concat(Array.from(root.querySelectorAll("*")));
        for (const element of elements) {
          if (forbidden.has(element.tagName.toLowerCase())) {
            element.remove();
            continue;
          }
          for (const attribute of Array.from(element.attributes)) {
            const name = attribute.name.toLowerCase();
            const value = attribute.value;
            if (name.startsWith("on") || name === "src") {
              element.removeAttribute(attribute.name);
            } else if (
              (name === "href" || name === "xlink:href") &&
              value &&
              !value.trim().startsWith("#")
            ) {
              element.removeAttribute(attribute.name);
            } else if (
              /javascript:|data:text\/html|expression\s*\(|behavior\s*:|-moz-binding/i.test(value)
            ) {
              element.removeAttribute(attribute.name);
            }
          }
        }
        for (const style of Array.from(root.querySelectorAll("style"))) {
          if (
            /@import|expression\s*\(|javascript:|url\s*\(\s*['"]?(?!#)/i.test(
              style.textContent || "",
            )
          ) {
            style.remove();
          }
        }
      }

      function setupParallax(rig, svgText) {
        const stage = $("parallax-stage");
        if (!stage) return;

        destroyParallax();

        if (darkCheckerboard) {
          stage.classList.add("checkerboard-dark");
        }

        let svgRoot;
        try {
          const documentNode = new DOMParser().parseFromString(svgText, "image/svg+xml");
          if (documentNode.querySelector("parsererror")) {
            throw new Error("The SVG markup could not be parsed");
          }
          svgRoot = documentNode.documentElement;
          if (!svgRoot || svgRoot.tagName.toLowerCase() !== "svg") {
            svgRoot = documentNode.querySelector("svg");
          }
          if (!svgRoot) {
            throw new Error("No <svg> root element");
          }
          sanitizeSvg(svgRoot);
        } catch (error) {
          const placeholder = document.createElement("div");
          placeholder.className = "parallax-placeholder";
          placeholder.textContent = "Could not load SVG: " + error.message;
          stage.replaceChildren(placeholder);
          return;
        }

        // Shadow DOM keeps the generated SVG's styles from leaking into the
        // review page and keeps the page's styles out of the illustration.
        let shadow = stage.shadowRoot;
        if (!shadow) {
          shadow = stage.attachShadow({ mode: "open" });
        }
        shadow.replaceChildren();

        const svg = document.importNode(svgRoot, true);
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        shadow.appendChild(svg);

        const hasAnchors = Array.isArray(rig.anchors) && rig.anchors.length > 0;
        const overlay = document.createElementNS(svg.namespaceURI, "g");
        overlay.setAttribute("id", "parallax-anchor-overlay");
        overlay.setAttribute("pointer-events", "none");
        svg.appendChild(overlay);

        const byId = new Map();
        for (const element of shadow.querySelectorAll("[id]")) {
          byId.set(element.id, element);
        }

        const nodeById = new Map();
        for (const node of rig.nodes) {
          nodeById.set(node.id, node);
        }

        const baseTransforms = new Map();
        for (const node of rig.nodes) {
          const element = byId.get(node.id);
          if (element) {
            baseTransforms.set(
              node.id,
              element.getAttribute("transform") || node.baseTransform || null,
            );
          }
        }

        const defaults = rig.defaults || {
          shift: 40,
          scale: 0.06,
          rotate: 1.5,
        };

        const prefersReducedMotion =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const state = {
          playing: false,
          playStart: 0,
          target: { x: 0.5, y: 0.5 },
          current: { x: 0.5, y: 0.5 },
          multipliers: {
            shift: defaults.shift ? 80 / defaults.shift : 1,
            scale: defaults.scale ? 0.2 / defaults.scale : 1,
            rotate: defaults.rotate ? 5 / defaults.rotate : 1,
          },
          raf: 0,
          lastTime: 0,
          time: 0,
          idle: !prefersReducedMotion,
          speed: 1,
          destroyed: false,
          anchorsVisible: false,
        };

        function renderAnchorOverlay(motions, corrections) {
          if (!state.anchorsVisible || !hasAnchors) {
            if (overlay.childNodes.length > 0) overlay.replaceChildren();
            return;
          }
          const doc = svg.ownerDocument;
          const fragment = doc.createDocumentFragment();

          function mark(tag, attributes) {
            const element = doc.createElementNS(svg.namespaceURI, tag);
            for (const name of Object.keys(attributes)) {
              element.setAttribute(name, String(attributes[name]));
            }
            fragment.appendChild(element);
          }

          for (const anchor of rig.anchors) {
            const host = nodeById.get(anchor.host);
            const hostMotion = motions.get(anchor.host);
            if (!host || !hostMotion) continue;
            const hostPoint = nodePoint(
              host,
              hostMotion,
              anchor.point,
              corrections.get(anchor.host),
            );

            for (const member of anchor.members) {
              if (member.frame !== "shared") continue;
              const memberNode = nodeById.get(member.node);
              const motion = motions.get(member.node);
              if (!memberNode || !motion) continue;
              const before = nodePoint(memberNode, motion, anchor.point);
              mark("line", {
                x1: before[0],
                y1: before[1],
                x2: hostPoint[0],
                y2: hostPoint[1],
                stroke: "#ef4444",
                "stroke-width": 3,
                "stroke-dasharray": "10 8",
                "stroke-linecap": "round",
                opacity: 0.85,
              });
              mark("circle", {
                cx: before[0],
                cy: before[1],
                r: 15,
                fill: "none",
                stroke: "#ef4444",
                "stroke-width": 3,
                opacity: 0.9,
              });
            }

            mark("circle", {
              cx: hostPoint[0],
              cy: hostPoint[1],
              r: 10,
              fill: "#22c55e",
              stroke: "#052e16",
              "stroke-width": 2,
            });
          }

          overlay.replaceChildren(fragment);
        }

        function apply(cursor, time) {
          const motions = new Map();
          for (const node of rig.nodes) {
            const parallax = evaluateParallaxMotion(
              node,
              cursor,
              rig.viewBox,
              state.multipliers,
            );
            const idle = evaluateIdleMotion(node, time);
            motions.set(node.id, combineMotions(parallax, idle));
          }
          const corrections = resolveAnchorCorrections(rig, motions);
          for (const node of rig.nodes) {
            const element = byId.get(node.id);
            if (!element) continue;
            const transform = transformForMotion(
              node,
              motions.get(node.id),
              corrections.get(node.id),
            );
            const base = baseTransforms.get(node.id);
            element.setAttribute(
              "transform",
              base ? transform + " " + base : transform,
            );
          }
          renderAnchorOverlay(motions, corrections);
        }

        function frame(now) {
          if (state.destroyed) return;
          const dt = state.lastTime ? Math.min(now - state.lastTime, 64) : 16;
          state.lastTime = now;
          if (state.idle) {
            state.time += (dt / 1000) * state.speed;
          }
          if (state.playing) {
            const time = (now - state.playStart) / 1000;
            state.target.x = 0.5 + 0.32 * Math.sin(time * 0.9);
            state.target.y = 0.5 + 0.32 * Math.sin(time * 1.3 + 1.7);
          }
          const easing = 1 - Math.exp(-dt / 90);
          state.current.x += (state.target.x - state.current.x) * easing;
          state.current.y += (state.target.y - state.current.y) * easing;
          apply(state.current, state.time);
          state.raf = requestAnimationFrame(frame);
        }

        const hint = $("parallax-hint");
        const onMove = (event) => {
          if (state.playing) return;
          const rect = stage.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;
          state.target.x = clamp(
            (event.clientX - rect.left) / rect.width,
            0,
            1,
          );
          state.target.y = clamp(
            (event.clientY - rect.top) / rect.height,
            0,
            1,
          );
          if (hint) hint.classList.add("hidden");
        };
        const onLeave = () => {
          if (!state.playing) {
            state.target.x = 0.5;
            state.target.y = 0.5;
          }
        };
        stage.addEventListener("pointermove", onMove);
        stage.addEventListener("pointerleave", onLeave);

        const checkerboardButton = $("p-checkerboard");
        const anchorsButton = $("p-anchors");
        const idleButton = $("p-idle");
        const play = $("p-play");
        const reset = $("p-reset");

        const listeners = [];
        function listen(element, type, handler) {
          if (!element) return;
          element.addEventListener(type, handler);
          listeners.push([element, type, handler]);
        }

        function syncCheckerboardButton() {
          if (!checkerboardButton) return;
          checkerboardButton.textContent = darkCheckerboard ? "Light bg" : "Dark bg";
          checkerboardButton.setAttribute(
            "aria-pressed",
            darkCheckerboard ? "true" : "false",
          );
        }
        syncCheckerboardButton();
        listen(checkerboardButton, "click", () => {
          darkCheckerboard = !darkCheckerboard;
          stage.classList.toggle("checkerboard-dark", darkCheckerboard);
          syncCheckerboardButton();
        });

        function syncAnchorsButton() {
          if (!anchorsButton) return;
          if (!hasAnchors) {
            anchorsButton.disabled = true;
            anchorsButton.title = "This rig has no joint welds";
            anchorsButton.textContent = "No anchors";
            return;
          }
          anchorsButton.textContent = state.anchorsVisible ? "Hide anchors" : "Anchors";
          anchorsButton.setAttribute(
            "aria-pressed",
            state.anchorsVisible ? "true" : "false",
          );
        }
        syncAnchorsButton();
        listen(anchorsButton, "click", () => {
          state.anchorsVisible = !state.anchorsVisible;
          syncAnchorsButton();
          apply(state.current, state.time);
        });

        function syncIdleButton() {
          if (!idleButton) return;
          idleButton.textContent = state.idle ? "Idle on" : "Idle off";
          idleButton.setAttribute(
            "aria-pressed",
            state.idle ? "true" : "false",
          );
        }
        syncIdleButton();
        listen(idleButton, "click", () => {
          state.idle = !state.idle;
          if (!state.idle) state.time = 0;
          syncIdleButton();
          apply(state.current, state.time);
        });

        listen(play, "click", () => {
          state.playing = !state.playing;
          if (state.playing) {
            state.playStart = performance.now();
            if (play) play.textContent = "Pause";
          } else if (play) {
            play.textContent = "Play";
          }
        });
        listen(reset, "click", () => {
          state.playing = false;
          state.target.x = 0.5;
          state.target.y = 0.5;
          state.current.x = 0.5;
          state.current.y = 0.5;
          state.time = 0;
          if (play) play.textContent = "Play";
          if (hint) hint.classList.remove("hidden");
          apply(state.current, state.time);
        });

        apply(state.current, state.time);
        state.raf = requestAnimationFrame(frame);

        parallaxPlayer = {
          destroy() {
            state.destroyed = true;
            cancelAnimationFrame(state.raf);
            stage.removeEventListener("pointermove", onMove);
            stage.removeEventListener("pointerleave", onLeave);
            for (const [element, type, handler] of listeners) {
              element.removeEventListener(type, handler);
            }
            listeners.length = 0;
            if (stage.shadowRoot) {
              stage.shadowRoot.replaceChildren();
            }
          },
        };
      }

      async function openDetail(id) {
        const request = ++detailRequest;
        state.currentId = id;
        destroyParallax();
        $("overlay").hidden = false;
        $("detail-title").textContent = "Conversion #" + id;
        $("detail-body").innerHTML = '<p class="muted">Loading…</p>';
        $("overlay").scrollTop = 0;

        let detail;
        try {
          detail = await api("/review/api/conversions/" + id);
        } catch (error) {
          if (request !== detailRequest) return;
          $("detail-body").innerHTML =
            '<div class="error-box">' + escapeHtml(error.message) + "</div>";
          return;
        }
        if (request !== detailRequest) return;

        const inputPane = detail.hasInput
          ? '<img src="/review/api/conversions/' + id + '/input" alt="input image" />'
          : '<div class="placeholder">Input image was not stored.</div>';
        const interactive = detail.status === "success" && Boolean(detail.rig);
        const outputPane =
          detail.status === "success"
            ? interactive
              ? '<div class="parallax-stage" id="parallax-stage"></div>' +
                '<div class="parallax-hint" id="parallax-hint">Move the cursor over the illustration</div>'
              : '<img src="/review/api/conversions/' + id + '/output.svg" alt="SVG output" />'
            : '<div class="placeholder">No SVG output for this conversion.</div>';
        const outputPreviewClass = interactive
          ? "preview preview-interactive"
          : "preview";
        const outputActions = interactive
          ? '<div class="preview-actions">' +
            '<button id="p-checkerboard" type="button" aria-pressed="false">Dark bg</button>' +
            '<button id="p-anchors" type="button" aria-pressed="false">Anchors</button>' +
            '<button id="p-idle" type="button" aria-pressed="true">Idle on</button>' +
            '<button id="p-play">Play</button><button id="p-reset">Reset</button></div>'
          : "";

        const warnings = detail.warnings || [];
        const warningHtml = warnings.length
          ? '<ul class="warnings">' +
            warnings.map((warning) => "<li>" + escapeHtml(warning) + "</li>").join("") +
            "</ul>"
          : '<p class="muted">No warnings.</p>';

        const errorHtml = detail.errorCode
          ? '<div class="error-box"><strong>' + escapeHtml(detail.errorCode) +
            "</strong><br />" + escapeHtml(detail.errorMessage || "") + "</div>"
          : "";

        const rigWarnings =
          detail.rig && Array.isArray(detail.rig.warnings)
            ? detail.rig.warnings
            : [];
        const rigDetails = detail.rig
          ? "<details><summary>Parallax rig" +
            (rigWarnings.length
              ? " · " + rigWarnings.length + " warning(s)"
              : "") +
            "</summary>" +
            (rigWarnings.length
              ? '<ul class="warnings">' +
                rigWarnings
                  .map((warning) => "<li>" + escapeHtml(warning) + "</li>")
                  .join("") +
                "</ul>"
              : "") +
            '<pre class="mono" id="raw-rig"></pre></details>'
          : "";

        const prompt = detail.prompt || {};
        const promptText = prompt.text || "";

        $("detail-body").innerHTML =
          '<div class="meta">' +
          "<span>Request <span class=\"mono\">" + escapeHtml(detail.requestId) + "</span></span>" +
          "<span>Status " + statusBadge(detail.status) + "</span>" +
          "<span>Model <span class=\"mono\">" + escapeHtml(detail.model || "—") + "</span></span>" +
          "<span>Prompt <span class=\"mono\">" + escapeHtml(detail.promptVersion) + "</span></span>" +
          "<span>" + escapeHtml(fmtDate(detail.createdAt)) + "</span>" +
          "</div>" +
          '<div class="previews">' +
          '<div><div class="preview-head"><p class="preview-label">Input sent to model</p></div>' +
          '<div class="preview">' + inputPane + "</div></div>" +
          '<div><div class="preview-head"><p class="preview-label">SVG output</p>' +
          outputActions + "</div>" +
          '<div class="' + outputPreviewClass + '">' + outputPane + "</div></div>" +
          "</div>" +
          '<div class="metrics">' +
          metric("Total latency", fmtMs(detail.latencyMs)) +
          metric("Upstream latency", fmtMs(detail.upstreamLatencyMs)) +
          metric("Attempts", fmtNum(detail.attempts)) +
          metric("Total tokens", fmtNum(detail.totalTokens)) +
          metric("Prompt tokens", fmtNum(detail.promptTokens)) +
          metric("Completion tokens", fmtNum(detail.completionTokens)) +
          metric("Input", detail.inputWidth ? detail.inputWidth + "×" + detail.inputHeight : "—") +
          metric("Original", detail.originalWidth ? detail.originalWidth + "×" + detail.originalHeight : "—") +
          metric("Input bytes", fmtBytes(detail.inputBytes)) +
          metric("Original bytes", fmtBytes(detail.originalBytes)) +
          metric("Downsampled", detail.downsampled ? "yes" : "no") +
          metric("SVG bytes", fmtBytes(detail.outputBytes)) +
          metric("SVG elements", fmtNum(detail.svgElements)) +
          metric("SVG paths", fmtNum(detail.svgPaths)) +
          "</div>" +
          errorHtml +
          '<details open><summary>Prompt · ' + escapeHtml(prompt.version || detail.promptVersion) +
          ' <span class="muted mono">' + escapeHtml(prompt.path || "") + "</span></summary>" +
          '<pre class="mono" id="prompt-text"></pre></details>' +
          '<details><summary>Warnings (' + warnings.length + ")</summary>" + warningHtml + "</details>" +
          '<details><summary>LLM calls</summary>' + renderCalls(detail.calls) + "</details>" +
          rigDetails +
          '<details><summary>Raw SVG</summary><pre class="mono" id="raw-svg">Loading…</pre></details>' +
          '<div class="toolbar" style="margin-top:12px">' +
          (detail.status === "success"
            ? '<a href="/review/api/conversions/' + id + '/output.svg" download="vector-' + id + '.svg">Download SVG</a>'
            : "") +
          "</div>";

        $("prompt-text").textContent = promptText;

        const rawRig = $("raw-rig");
        if (rawRig) {
          rawRig.textContent = detail.rig
            ? JSON.stringify(detail.rig, null, 2)
            : "No parallax rig.";
        }

        if (detail.status === "success") {
          fetch("/review/api/conversions/" + id + "/output.svg")
            .then((response) => response.text())
            .then((text) => {
              if (request !== detailRequest || $("overlay").hidden) return;
              const node = $("raw-svg");
              if (node) node.textContent = text;
            })
            .catch((error) => {
              if (request !== detailRequest || $("overlay").hidden) return;
              const node = $("raw-svg");
              if (node) node.textContent = "Failed to load SVG: " + error.message;
            });

          if (detail.rig) {
            fetch("/review/api/conversions/" + id + "/parallax.svg")
              .then((response) => {
                if (!response.ok) {
                  throw new Error(response.status + " " + response.statusText);
                }
                return response.text();
              })
              .then((text) => {
                if (request !== detailRequest || $("overlay").hidden) return;
                setupParallax(detail.rig, text);
              })
              .catch((error) => {
                if (request !== detailRequest || $("overlay").hidden) return;
                const stage = $("parallax-stage");
                if (!stage) return;
                const placeholder = document.createElement("div");
                placeholder.className = "parallax-placeholder";
                placeholder.textContent =
                  "Could not load the parallax preview: " + error.message;
                stage.replaceChildren(placeholder);
              });
          }
        } else {
          const node = $("raw-svg");
          if (node) node.textContent = "No SVG output.";
        }
      }

      async function navigateStep(delta) {
        if ($("overlay").hidden) return;
        const index = state.items.findIndex((item) => item.id === state.currentId);
        if (index === -1) return;

        const target = index + delta;
        if (target >= 0 && target < state.items.length) {
          return openDetail(state.items[target].id);
        }

        // Crossed a page boundary: move the list one page over, then open the edge item.
        const nextOffset = state.offset + delta * state.limit;
        if (nextOffset < 0 || nextOffset >= state.total) return;
        state.offset = nextOffset;
        const items = await loadList();
        if (!items || items.length === 0) return;
        return openDetail(delta > 0 ? items[0].id : items[items.length - 1].id);
      }

      // Serialize navigation so held/repeated arrow keys apply in order instead of racing.
      let navQueue = Promise.resolve();
      function navigate(delta) {
        navQueue = navQueue.then(() => navigateStep(delta)).catch(() => {});
        return navQueue;
      }

      async function loadStats() {
        try {
          renderStats(await api("/review/api/stats"));
        } catch (error) {
          $("stats").innerHTML =
            '<div class="card"><div class="label">Stats error</div><div class="value">' +
            escapeHtml(error.message) + "</div></div>";
        }
      }

      async function loadList() {
        const params = new URLSearchParams();
        params.set("limit", String(state.limit));
        params.set("offset", String(state.offset));
        for (const [key, value] of Object.entries(state.filters)) {
          if (value) params.set(key, value);
        }

        try {
          const data = await api("/review/api/conversions?" + params.toString());
          state.total = data.total;
          state.items = data.items;
          renderRows(data.items);
          const start = data.total === 0 ? 0 : state.offset + 1;
          const end = Math.min(state.offset + state.limit, data.total);
          $("page").textContent = start + "–" + end + " of " + data.total;
          $("prev").disabled = state.offset <= 0;
          $("next").disabled = state.offset + state.limit >= data.total;
          return data.items;
        } catch (error) {
          $("rows").innerHTML = "";
          state.items = [];
          $("empty").hidden = false;
          $("empty").textContent = "Failed to load conversions: " + error.message;
          return null;
        }
      }

      function readFilters() {
        state.filters = {
          status: $("status").value,
          model: $("model").value.trim(),
          promptVersion: $("promptVersion").value.trim(),
          q: $("q").value.trim(),
        };
      }

      $("apply").addEventListener("click", () => {
        readFilters();
        state.offset = 0;
        loadList();
      });

      $("reset").addEventListener("click", () => {
        $("status").value = "";
        $("model").value = "";
        $("promptVersion").value = "";
        $("q").value = "";
        state.filters = {};
        state.offset = 0;
        loadList();
      });

      $("refresh").addEventListener("click", () => {
        loadStats();
        loadList();
      });

      $("prev").addEventListener("click", () => {
        state.offset = Math.max(0, state.offset - state.limit);
        loadList();
      });

      $("next").addEventListener("click", () => {
        state.offset += state.limit;
        loadList();
      });

      $("close").addEventListener("click", () => {
        $("overlay").hidden = true;
        destroyParallax();
      });

      $("overlay").addEventListener("click", (event) => {
        if (event.target === $("overlay")) {
          $("overlay").hidden = true;
          destroyParallax();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          $("overlay").hidden = true;
          destroyParallax();
          return;
        }
        if ($("overlay").hidden) return;
        if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;

        const tag = event.target?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || event.target?.isContentEditable) {
          return;
        }

        if (event.key === "ArrowRight") {
          event.preventDefault();
          navigate(1);
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          navigate(-1);
        }
      });

      loadStats();
      loadList();
    </script>
  </body>
</html>

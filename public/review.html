<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vector · review</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2330;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --good: #3fb950;
        --bad: #f85149;
        --warn: #d29922;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 24px 12px;
      }
      h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
      h2 { margin: 0; font-size: 16px; }
      p.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      main { padding: 0 24px 32px; }
      button, select, input {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 10px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: #1f6feb; border-color: #1f6feb; }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      .card .value { font-size: 22px; font-weight: 650; margin-top: 2px; }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .filters input { min-width: 150px; }
      .table-wrap {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: auto;
      }
      table { width: 100%; border-collapse: collapse; min-width: 980px; }
      th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
      th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; background: var(--panel-2); position: sticky; top: 0; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: #1b2230; }
      tbody tr:last-child td { border-bottom: 0; }
      .thumb { width: 44px; height: 44px; object-fit: contain; background: conic-gradient(#e0e0e0 25%, #fff 0 50%, #e0e0e0 0 75%, #fff 0) 0 0 / 8px 8px; border-radius: 4px; border: 1px solid var(--border); }
      .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; }
      .badge.success { color: var(--good); background: rgba(63, 185, 80, 0.12); }
      .badge.error { color: var(--bad); background: rgba(248, 81, 73, 0.12); }
      .badge.ds { color: var(--warn); background: rgba(210, 153, 34, 0.12); }
      .muted { color: var(--muted); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .empty { padding: 28px; text-align: center; color: var(--muted); }
      footer.pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding-top: 12px; }
      .prompt-stats { margin: 0 0 14px; }
      .prompt-stats table { min-width: 0; }
      .prompt-stats th, .prompt-stats td { padding: 6px 8px; }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(1, 4, 9, 0.72);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
        overflow: auto;
        z-index: 10;
      }
      .overlay[hidden] { display: none; }
      .panel {
        width: min(1180px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: var(--panel);
        border-radius: 10px 10px 0 0;
        z-index: 1;
      }
      .panel-body { padding: 18px; }
      .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
      .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 800px) { .previews { grid-template-columns: 1fr; } }
      .preview {
        position: relative;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .preview img {
        max-width: 100%;
        max-height: 520px;
        display: block;
        background: conic-gradient(#e0e0e0 25%, #fff 0 50%, #e0e0e0 0 75%, #fff 0) 0 0 / 16px 16px;
      }
      .preview .placeholder { color: #57606a; padding: 20px; text-align: center; }
      .preview-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 6px; }
      .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .preview-head .preview-label { margin: 0; }
      .preview-actions { display: flex; gap: 6px; }
      .preview-actions button { padding: 3px 9px; font-size: 12px; }
      .preview-interactive { padding: 0; }
      .parallax-stage {
        width: min(100%, 520px);
        aspect-ratio: 1;
        background: conic-gradient(#e0e0e0 25%, #fff 0 50%, #e0e0e0 0 75%, #fff 0) 0 0 / 16px 16px;
        cursor: crosshair;
        touch-action: none;
      }
      .parallax-stage.checkerboard-dark {
        background: conic-gradient(#3a4048 25%, #22272e 0 50%, #3a4048 0 75%, #22272e 0) 0 0 / 16px 16px;
      }
      .parallax-stage svg { display: block; width: 100%; height: 100%; }
      .parallax-hint {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(13, 17, 23, 0.72);
        color: #fff;
        font-size: 12px;
        pointer-events: none;
        transition: opacity 180ms ease;
        white-space: nowrap;
      }
      .parallax-hint.hidden { opacity: 0; }
      .parallax-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 520px;
        aspect-ratio: 1;
        color: #57606a;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        margin: 0 auto;
      }
      .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 16px 0; }
      .metric { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
      .metric .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
      .metric .v { font-weight: 600; margin-top: 1px; }
      details { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 12px; background: var(--panel-2); }
      summary { cursor: pointer; font-weight: 600; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 10px 0 0; max-height: 420px; overflow: auto; }
      .warnings { margin: 8px 0 0; padding-left: 20px; color: var(--warn); }
      .calls { margin-top: 10px; }
      .calls table { min-width: 0; }
      .calls th, .calls td { padding: 6px 8px; }
      .error-box { color: var(--bad); background: rgba(248, 81, 73, 0.08); border: 1px solid rgba(248, 81, 73, 0.3); border-radius: 6px; padding: 10px 12px; margin-top: 12px; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
      .rating-cell { white-space: nowrap; }
      .rating-buttons { display: inline-flex; gap: 3px; }
      .rating-btn {
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 11px;
        line-height: 1.5;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .rating-btn:hover { border-color: var(--accent); }
      .rating-btn.selected.nice {
        color: var(--good);
        border-color: rgba(63, 185, 80, 0.65);
        background: rgba(63, 185, 80, 0.14);
      }
      .rating-btn.selected.fair {
        color: var(--warn);
        border-color: rgba(210, 153, 34, 0.65);
        background: rgba(210, 153, 34, 0.14);
      }
      .rating-btn.selected.bad {
        color: var(--bad);
        border-color: rgba(248, 81, 73, 0.65);
        background: rgba(248, 81, 73, 0.14);
      }
      .feature-btn { padding: 2px 7px; font-size: 14px; line-height: 1.3; }
      .feature-btn.selected {
        color: var(--warn);
        border-color: rgba(210, 153, 34, 0.7);
        background: rgba(210, 153, 34, 0.16);
      }
      .rating-toolbar { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; }
      .rating-toolbar .rating-buttons { gap: 5px; }
      .rating-toolbar .rating-btn { padding: 4px 12px; font-size: 12px; }
      .publish-button { position: relative; }
      .publish-button .count {
        display: inline-block;
        min-width: 18px;
        margin-left: 6px;
        padding: 0 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 11px;
      }
      .publish-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
        margin-bottom: 14px;
      }
      .publish-summary .metric .v { font-size: 20px; }
      .publish-title { width: 100%; }
      .publish-intro { width: 100%; min-height: 150px; resize: vertical; }
      .word-count { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .word-count.over { color: var(--bad); }
      .publish-out { margin-top: 12px; }
      .publish-out pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
      .publish-note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        max-width: min(440px, calc(100vw - 40px));
        padding: 10px 14px;
        border-radius: 8px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        z-index: 30;
        transition: opacity 180ms ease, transform 180ms ease;
      }
      .toast[hidden] { display: none; }
      .toast.error { border-color: rgba(248, 81, 73, 0.55); color: var(--bad); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>vector · review</h1>
        <p class="sub">Inspect conversion inputs, SVG outputs, prompts, and LLM metrics.</p>
      </div>
      <div class="toolbar">
        <button id="publish" class="publish-button">Publish<span class="count" id="publish-count">0</span></button>
        <button id="refresh" class="primary">Refresh</button>
      </div>
    </header>

    <main>
      <section class="stats" id="stats"></section>
      <section class="prompt-stats" id="prompt-stats"></section>

      <section class="filters">
        <select id="status">
          <option value="">All statuses</option>
          <option value="success">Success</option>
          <option value="error">Error</option>
        </select>
        <select id="rating">
          <option value="">All ratings</option>
          <option value="unrated">Unrated</option>
          <option value="nice">Nice</option>
          <option value="fair">Fair</option>
          <option value="bad">Bad</option>
        </select>
        <input id="model" placeholder="Model" />
        <input id="promptVersion" placeholder="Prompt version" />
        <input id="q" placeholder="Search request id / model / prompt" />
        <button id="apply" class="primary">Apply</button>
        <button id="reset">Reset</button>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID / time</th>
              <th>Status</th>
              <th>Rating</th>
              <th>Input</th>
              <th>Dimensions</th>
              <th>Model</th>
              <th>Prompt</th>
              <th>Attempts</th>
              <th>Latency</th>
              <th>Tokens</th>
              <th>Cost</th>
              <th>SVG</th>
              <th>Warnings</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden>No conversions recorded yet.</div>
      </section>

      <footer class="pager">
        <span id="page" class="muted"></span>
        <button id="prev">Prev</button>
        <button id="next">Next</button>
      </footer>
    </main>

    <div id="overlay" class="overlay" hidden>
      <div class="panel">
        <div class="panel-head">
          <h2 id="detail-title">Conversion</h2>
          <button id="close">Close</button>
        </div>
        <div class="panel-body" id="detail-body"></div>
      </div>
    </div>

    <div id="publish-overlay" class="overlay" hidden>
      <div class="panel">
        <div class="panel-head">
          <h2 id="publish-title">Publish selected results</h2>
          <button id="publish-close">Close</button>
        </div>
        <div class="panel-body" id="publish-body"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/review/parallax-player.js"></script>
    <script>
      const state = {
        limit: 25,
        offset: 0,
        total: 0,
        filters: {},
        items: [],
        currentId: null,
        publication: null,
      };
      let detailRequest = 0;
      let toastTimer = 0;

      const $ = (id) => document.getElementById(id);

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function fmtNum(value) {
        return Number(value ?? 0).toLocaleString();
      }

      function fmtMs(value) {
        const ms = Number(value ?? 0);
        return ms >= 1000 ? (ms / 1000).toFixed(2) + " s" : Math.round(ms) + " ms";
      }

      function fmtCost(value) {
        if (value === null || value === undefined) return "—";
        const usd = Number(value);
        if (!Number.isFinite(usd)) return "—";
        if (usd === 0) return "$0";
        if (usd < 0.01) return "$" + usd.toFixed(6);
        if (usd < 1) return "$" + usd.toFixed(4);
        return "$" + usd.toFixed(2);
      }

      function fmtBytes(value) {
        const bytes = Number(value ?? 0);
        if (!bytes) return "—";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KiB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MiB";
      }

      function fmtDate(value) {
        if (!value) return "—";
        return new Date(Number(value)).toLocaleString();
      }

      function statusBadge(status) {
        return '<span class="badge ' + escapeHtml(status) + '">' + escapeHtml(status) + "</span>";
      }

      async function api(path) {
        const response = await fetch(path, { headers: { accept: "application/json" } });
        if (!response.ok) {
          let message = response.status + " " + response.statusText;
          try {
            const body = await response.json();
            message = body?.error?.message || message;
          } catch {}
          throw new Error(message);
        }
        return response.json();
      }

      function renderStats(stats) {
        const cards = [
          ["Conversions", fmtNum(stats.total)],
          ["Success rate", (Number(stats.successRate ?? 0) * 100).toFixed(1) + "%"],
          ["Avg latency", fmtMs(stats.avgLatencyMs)],
          ["Total tokens", fmtNum(stats.totalTokens)],
          ["Avg tokens", fmtNum(Math.round(stats.avgTokens ?? 0))],
          ["Total cost", stats.costedConversions > 0 ? fmtCost(stats.totalCostUsd) : "—"],
          ["Avg cost", stats.costedConversions > 0 ? fmtCost(stats.avgCostUsd) : "—"],
          ["Cost coverage", fmtNum(stats.costedConversions) + "/" + fmtNum(stats.total)],
          ["Cache hit", (Number(stats.cacheHitRate ?? 0) * 100).toFixed(0) + "%"],
          ["Reasoning tokens", fmtNum(stats.totalReasoningTokens)],
          ["Downsampled", fmtNum(stats.downsampled)],
        ];
        $("stats").innerHTML = cards
          .map(
            ([label, value]) =>
              '<div class="card"><div class="label">' + escapeHtml(label) +
              '</div><div class="value">' + escapeHtml(value) + "</div></div>",
          )
          .join("");

        const prompts = stats.prompts || [];
        if (prompts.length === 0) {
          $("prompt-stats").innerHTML = "";
          return;
        }
        $("prompt-stats").innerHTML =
          '<div class="table-wrap"><table><thead><tr>' +
          "<th>Prompt version</th><th>Total</th><th>Success</th><th>Errors</th>" +
          "<th>Avg latency</th><th>Avg tokens</th><th>Total cost</th>" +
          "<th>Avg cost</th></tr></thead><tbody>" +
          prompts
            .map(
              (prompt) =>
                "<tr><td class=\"mono\">" + escapeHtml(prompt.version) +
                "</td><td>" + fmtNum(prompt.total) +
                "</td><td>" + fmtNum(prompt.successes) +
                "</td><td>" + fmtNum(prompt.errors) +
                "</td><td>" + escapeHtml(fmtMs(prompt.avgLatencyMs)) +
                "</td><td>" + fmtNum(Math.round(prompt.avgTokens ?? 0)) +
                "</td><td>" +
                escapeHtml(
                  prompt.costedConversions > 0 ? fmtCost(prompt.totalCostUsd) : "—",
                ) +
                "</td><td>" +
                escapeHtml(
                  prompt.costedConversions > 0 ? fmtCost(prompt.avgCostUsd) : "—",
                ) +
                "</td></tr>",
            )
            .join("") +
          "</tbody></table></div>";
      }

      function ratingButtons(item) {
        if (item.status !== "success") {
          return '<span class="muted">—</span>';
        }
        const labels = { nice: "Nice", fair: "Fair", bad: "Bad" };
        const buttons = Object.entries(labels)
          .map(([rating, label]) => {
            const active = item.rating === rating;
            return (
              '<button type="button" class="rating-btn ' + rating +
              (active ? " selected" : "") + '" data-rate="' + rating +
              '" data-id="' + item.id + '" aria-pressed="' +
              (active ? "true" : "false") + '" title="' +
              (active ? "Clear rating" : "Mark as " + label) + '">' +
              label + "</button>"
            );
          })
          .join("");
        const featured =
          '<button type="button" class="rating-btn feature-btn' +
          (item.featured ? " selected" : "") +
          '" data-feature="' + item.id + '" aria-pressed="' +
          (item.featured ? "true" : "false") + '" title="' +
          (item.featured
            ? "Clear featured pick"
            : "Feature at top of publication page") +
          '">★</button>';
        return '<span class="rating-buttons">' + buttons + featured + "</span>";
      }

      function renderRows(items) {
        $("empty").hidden = items.length > 0;
        $("rows").innerHTML = items
          .map((item) => {
            const thumb = item.hasInput
              ? '<img class="thumb" loading="lazy" src="/review/api/conversions/' +
                item.id + '/input" alt="input" />'
              : '<span class="muted">—</span>';
            const dims = item.inputWidth
              ? item.inputWidth + "×" + item.inputHeight
              : "—";
            const original = item.originalWidth
              ? item.originalWidth + "×" + item.originalHeight
              : "—";
            const ds = item.downsampled
              ? ' <span class="badge ds">DS</span>'
              : "";
            const svg = item.outputBytes
              ? fmtBytes(item.outputBytes) + " · " + fmtNum(item.svgPaths) + " paths"
              : "—";
            return (
              '<tr data-id="' + item.id + '">' +
              "<td><div class=\"mono\">#" + item.id + "</div><div class=\"muted\">" +
              escapeHtml(fmtDate(item.createdAt)) + "</div></td>" +
              "<td>" + statusBadge(item.status) + "</td>" +
              '<td class="rating-cell">' + ratingButtons(item) + "</td>" +
              "<td>" + thumb + "</td>" +
              "<td><div>" + escapeHtml(dims) + ds + "</div><div class=\"muted\">from " +
              escapeHtml(original) + "</div></td>" +
              "<td class=\"mono\">" + escapeHtml(item.model || "—") + "</td>" +
              "<td class=\"mono\">" + escapeHtml(item.promptVersion) + "</td>" +
              "<td>" + fmtNum(item.attempts) + "</td>" +
              "<td>" + escapeHtml(fmtMs(item.latencyMs)) + "</td>" +
              "<td>" + fmtNum(item.totalTokens) + "</td>" +
              "<td>" + escapeHtml(fmtCost(item.costUsd)) + "</td>" +
              "<td>" + escapeHtml(svg) + "</td>" +
              "<td>" + fmtNum(item.warningCount) + "</td>" +
              "</tr>"
            );
          })
          .join("");
      }

      $("rows").addEventListener("click", (event) => {
        const featureButton = event.target.closest("[data-feature]");
        if (featureButton) {
          event.stopPropagation();
          const id = Number(featureButton.dataset.feature);
          const item = state.items.find((entry) => entry.id === id);
          setFeatured(id, Boolean(item && item.featured));
          return;
        }
        const ratingButton = event.target.closest("[data-rate]");
        if (ratingButton) {
          event.stopPropagation();
          const id = Number(ratingButton.dataset.id);
          const item = state.items.find((entry) => entry.id === id);
          setRating(id, ratingButton.dataset.rate, item ? item.rating : null);
          return;
        }
        const row = event.target.closest("tr[data-id]");
        if (row) {
          openDetail(Number(row.dataset.id));
        }
      });

      $("detail-body").addEventListener("click", (event) => {
        const featureButton = event.target.closest("[data-feature]");
        if (featureButton) {
          const id = Number(featureButton.dataset.feature);
          const item = state.items.find((entry) => entry.id === id);
          setFeatured(id, Boolean(item && item.featured));
          return;
        }
        const ratingButton = event.target.closest("[data-rate]");
        if (!ratingButton) return;
        const id = Number(ratingButton.dataset.id);
        const item = state.items.find((entry) => entry.id === id);
        setRating(id, ratingButton.dataset.rate, item ? item.rating : null);
      });

      function showToast(message, isError) {
        const toast = $("toast");
        toast.textContent = message;
        toast.classList.toggle("error", Boolean(isError));
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          toast.hidden = true;
        }, isError ? 6000 : 3200);
      }

      function syncDetailRating(id, rating) {
        if (state.currentId !== id) return;
        const container = $("detail-rating");
        if (!container) return;
        for (const button of container.querySelectorAll("[data-rate]")) {
          const active = button.dataset.rate === rating;
          button.classList.toggle("selected", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
          button.title = active ? "Clear rating" : "Mark as " + button.textContent;
        }
      }

      async function setRating(id, rating, current) {
        const next = current === rating ? null : rating;
        try {
          const response = await fetch(
            "/review/api/conversions/" + id + "/selection",
            {
              method: "PUT",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ rating: next }),
            },
          );
          if (!response.ok) {
            let message = response.status + " " + response.statusText;
            try {
              const body = await response.json();
              message = body?.error?.message || message;
            } catch {}
            throw new Error(message);
          }
          const body = await response.json();
          const item = state.items.find((entry) => entry.id === id);
          if (item) item.rating = body.rating;
          if (state.filters.rating) {
            loadList();
          } else {
            renderRows(state.items);
          }
          syncDetailRating(id, body.rating);
          showToast(
            body.rating
              ? "Conversion #" + id + " marked " + body.rating
              : "Conversion #" + id + " unrated",
          );
          loadPublicationMeta();
        } catch (error) {
          showToast("Could not update rating: " + error.message, true);
        }
      }

      function syncDetailFeature(id, featured) {
        if (state.currentId !== id) return;
        const container = $("detail-rating");
        if (!container) return;
        for (const button of container.querySelectorAll("[data-feature]")) {
          button.classList.toggle("selected", featured);
          button.setAttribute("aria-pressed", featured ? "true" : "false");
          button.title = featured
            ? "Clear featured pick"
            : "Feature at top of publication page";
        }
      }

      async function setFeatured(id, current) {
        const next = current ? null : id;
        try {
          const response = await fetch(
            "/review/api/publication/featured",
            {
              method: "PUT",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ conversionId: next }),
            },
          );
          if (!response.ok) {
            let message = response.status + " " + response.statusText;
            try {
              const body = await response.json();
              message = body?.error?.message || message;
            } catch {}
            throw new Error(message);
          }
          const body = await response.json();
          for (const item of state.items) {
            item.featured = body.conversionId === item.id;
          }
          renderRows(state.items);
          syncDetailFeature(id, body.conversionId === id);
          showToast(
            body.conversionId
              ? "Conversion #" + body.conversionId + " featured at the top"
              : "Featured pick cleared",
          );
          loadPublicationMeta();
        } catch (error) {
          showToast("Could not update featured pick: " + error.message, true);
        }
      }

      async function loadPublicationMeta() {
        try {
          const meta = await api("/review/api/publication");
          state.publication = meta;
          $("publish").disabled = false;
          $("publish-count").textContent =
            String(meta.counts.total) + (meta.featured ? " ★" : "");
          return meta;
        } catch (error) {
          state.publication = null;
          $("publish").disabled = true;
          $("publish").title = "Publication API is disabled";
          $("publish-count").textContent = "—";
          return null;
        }
      }

      function suggestedTag() {
        const now = new Date();
        const pad = (value) => String(value).padStart(2, "0");
        return (
          "publish." + now.getFullYear() + "-" + pad(now.getMonth() + 1) +
          "-" + pad(now.getDate())
        );
      }

      function openPublish() {
        $("publish-overlay").hidden = false;
        $("publish-overlay").scrollTop = 0;
        $("publish-body").innerHTML = '<p class="muted">Loading…</p>';
        loadPublicationMeta().then((meta) => {
          if (!meta) {
            $("publish-body").innerHTML =
              '<div class="error-box">The publication API is disabled. ' +
              "Set PUBLISH_ENABLED=true and restart the service.</div>";
            return;
          }
          renderPublishPanel(meta);
        });
      }

      function wordCount(value) {
        const trimmed = String(value || "").trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }

      function renderPublishPanel(meta) {
        const counts = meta.counts;
        const tag = suggestedTag();
        $("publish-body").innerHTML =
          '<div class="publish-summary">' +
          metric("Nice", fmtNum(counts.nice)) +
          metric("Fair", fmtNum(counts.fair)) +
          metric("Bad", fmtNum(counts.bad)) +
          metric("Total rated", fmtNum(counts.total)) +
          metric(
            "Featured",
            meta.featured ? "#" + String(meta.featured.id) : "—",
          ) +
          "</div>" +
          '<p class="muted">The bundle is written to <span class="mono">' +
          escapeHtml(meta.publishDir) + "</span>. It is ignored locally; the " +
          "commit happens on a generated <span class=\"mono\">publish.*</span> branch.</p>" +
          (meta.featured
            ? '<p class="publish-note">Featured: <span class="mono">#' +
              String(meta.featured.id) + "</span> · shown only in the idle hero, " +
              "without an input image or interaction. It is excluded from the " +
              "rated galleries.</p>"
            : '<p class="publish-note">No featured pick. The top hero will be omitted.</p>') +
          '<label class="preview-label" for="publish-heading">Page heading</label>' +
          '<input class="publish-title" id="publish-heading" value="' +
          escapeHtml(meta.title) + '" />' +
          '<label class="preview-label" for="publish-intro" style="display:block;margin-top:12px">Intro (less than 100 words)</label>' +
          '<textarea class="publish-intro" id="publish-intro">' +
          escapeHtml(meta.intro || meta.defaultIntro) + "</textarea>" +
          '<div class="word-count" id="publish-word-count"></div>' +
          '<div class="filters" style="margin-top:14px">' +
          '<input id="publish-tag" value="' + escapeHtml(tag) + '" ' +
          'placeholder="publish.2026-11-16" style="min-width:220px" />' +
          '<button id="publish-write" class="primary">Write bundle</button>' +
          "</div>" +
          '<div class="publish-out" id="publish-out"></div>';

        const title = $("publish-heading");
        const intro = $("publish-intro");
        const counter = $("publish-word-count");
        const updateForm = () => {
          const words = wordCount(intro.value);
          counter.textContent = words + " / " + meta.maxIntroWords + " words";
          counter.classList.toggle("over", words > meta.maxIntroWords);
          $("publish-write").disabled =
            title.value.trim().length === 0 ||
            words === 0 ||
            words > meta.maxIntroWords ||
            (counts.total === 0 && !meta.featured);
        };
        title.addEventListener("input", updateForm);
        intro.addEventListener("input", updateForm);
        updateForm();

        $("publish-write").addEventListener("click", async () => {
          const button = $("publish-write");
          button.disabled = true;
          button.textContent = "Writing…";
          try {
            const response = await fetch("/review/api/publish", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                title: title.value.trim(),
                intro: intro.value,
              }),
            });
            if (!response.ok) {
              let message = response.status + " " + response.statusText;
              try {
                const body = await response.json();
                message = body?.error?.message || message;
              } catch {}
              throw new Error(message);
            }
            const result = await response.json();
            const branch = $("publish-tag").value.trim();
            if (!/^publish\.[A-Za-z0-9._-]+$/.test(branch) || branch.includes("..")) {
              throw new Error(
                "Tag must start with publish. and contain only letters, digits, dots, underscores, or dashes",
              );
            }
            const commands =
              "npm run publish:branch -- --name " + branch + "\n" +
              "git push origin refs/heads/" + branch + ":refs/heads/" + branch + "\n" +
              "git push origin refs/tags/" + branch + ":refs/tags/" + branch;
            $("publish-out").innerHTML =
              '<div class="card"><div class="label">Bundle written</div>' +
              '<div class="mono" style="margin-top:6px">' +
              escapeHtml(result.manifestPath) + "</div>" +
              '<div class="muted">' + fmtNum(result.itemCount) + " gallery items · " +
              fmtNum(result.introWords) + " intro words" +
              (result.featuredId ? " · featured #" + result.featuredId : "") +
              "</div></div>" +
              '<p class="publish-note">The working tree is not modified. ' +
              "Create the publish branch from the current HEAD with:</p>" +
              "<pre class=\"mono\">" + escapeHtml(commands) + "</pre>" +
              '<div class="toolbar"><button type="button" id="copy-commands">Copy commands</button></div>';
            $("copy-commands").addEventListener("click", async () => {
              try {
                await navigator.clipboard.writeText(commands);
                showToast("Commands copied");
              } catch {
                showToast("Could not copy commands", true);
              }
            });
            showToast("Publication bundle written");
            loadPublicationMeta();
          } catch (error) {
            $("publish-out").innerHTML =
              '<div class="error-box">' + escapeHtml(error.message) + "</div>";
          } finally {
            button.textContent = "Write bundle";
            updateForm();
          }
        });
      }

      function metric(label, value) {
        return (
          '<div class="metric"><div class="k">' + escapeHtml(label) +
          '</div><div class="v">' + escapeHtml(value) + "</div></div>"
        );
      }

      function renderCalls(calls) {
        if (!calls || calls.length === 0) {
          return '<p class="muted">No per-call metrics recorded.</p>';
        }
        return (
          '<div class="calls"><table><thead><tr>' +
          "<th>Attempt</th><th>Model</th><th>Latency</th><th>Prompt</th>" +
          "<th>Completion</th><th>Total</th><th>Cost</th><th>Finish</th><th>Chars</th>" +
          "</tr></thead><tbody>" +
          calls
            .map(
              (call) =>
                "<tr><td>" + fmtNum(call.attempt) +
                "</td><td class=\"mono\">" + escapeHtml(call.model) +
                "</td><td>" + escapeHtml(fmtMs(call.latencyMs)) +
                "</td><td>" + fmtNum(call.promptTokens) +
                "</td><td>" + fmtNum(call.completionTokens) +
                "</td><td>" + fmtNum(call.totalTokens) +
                "</td><td>" + escapeHtml(fmtCost(call.costUsd)) +
                "</td><td>" + escapeHtml(call.finishReason || "—") +
                "</td><td>" + fmtNum(call.contentLength) +
                "</td></tr>",
            )

          "</tbody></table></div>"

      // ---------------------------------------------------------------------
      // Interactive parallax player (shared with the published site)
      // ---------------------------------------------------------------------

      let parallaxPlayer = null;
      let parallaxCleanup = null;
      let darkCheckerboard = false;

      function destroyParallax() {
        if (parallaxCleanup) {
          parallaxCleanup();
          parallaxCleanup = null;
        }
        if (parallaxPlayer) {
          parallaxPlayer.destroy();
          parallaxPlayer = null;
        }
      }

      function prefersReducedMotion() {
        return (
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function setupParallax(rig, svgText) {
        const stage = $("parallax-stage");
        if (!stage) return;

        destroyParallax();

        try {
          parallaxPlayer = window.VectorParallax.create(stage, svgText, rig, {
            idle: !prefersReducedMotion(),
            dark: darkCheckerboard,
          });
        } catch (error) {
          const placeholder = document.createElement("div");
          placeholder.className = "parallax-placeholder";
          placeholder.textContent = "Could not load SVG: " + error.message;
          stage.replaceChildren(placeholder);
          return;
        }

        const hint = $("parallax-hint");
        const listenerList = [];
        let playing = false;
        let playStart = 0;
        let playRaf = 0;

        function listen(element, type, handler) {
          if (!element) return;
          element.addEventListener(type, handler);
          listenerList.push([element, type, handler]);
        }

        const onMove = (event) => {
          if (playing) return;
          const rect = stage.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;
          parallaxPlayer.setCursor(
            clamp((event.clientX - rect.left) / rect.width, 0, 1),
            clamp((event.clientY - rect.top) / rect.height, 0, 1),
          );
          if (hint) hint.classList.add("hidden");
        };
        const onLeave = () => {
          if (!playing) parallaxPlayer.setNeutral();
        };
        listen(stage, "pointermove", onMove);
        listen(stage, "pointerleave", onLeave);

        const checkerboardButton = $("p-checkerboard");
        const anchorsButton = $("p-anchors");
        const idleButton = $("p-idle");
        const playButton = $("p-play");
        const resetButton = $("p-reset");

        function syncCheckerboardButton() {
          if (!checkerboardButton) return;
          checkerboardButton.textContent = darkCheckerboard ? "Light bg" : "Dark bg";
          checkerboardButton.setAttribute(
            "aria-pressed",
            darkCheckerboard ? "true" : "false",
          );
        }
        syncCheckerboardButton();
        listen(checkerboardButton, "click", () => {
          darkCheckerboard = !darkCheckerboard;
          parallaxPlayer.setDark(darkCheckerboard);
          syncCheckerboardButton();
        });

        function syncAnchorsButton() {
          if (!anchorsButton) return;
          if (!parallaxPlayer.hasAnchors()) {
            anchorsButton.disabled = true;
            anchorsButton.title = "This rig has no joint welds";
            anchorsButton.textContent = "No anchors";
            return;
          }
          anchorsButton.textContent = "Anchors";
          anchorsButton.setAttribute("aria-pressed", "false");
        }
        syncAnchorsButton();
        let anchorsVisible = false;
        listen(anchorsButton, "click", () => {
          anchorsVisible = !anchorsVisible;
          parallaxPlayer.setAnchors(anchorsVisible);
          if (anchorsButton) {
            anchorsButton.textContent = anchorsVisible ? "Hide anchors" : "Anchors";
            anchorsButton.setAttribute(
              "aria-pressed",
              anchorsVisible ? "true" : "false",
            );
          }
        });

        let idleOn = !prefersReducedMotion();
        function syncIdleButton() {
          if (!idleButton) return;
          idleButton.textContent = idleOn ? "Idle on" : "Idle off";
          idleButton.setAttribute("aria-pressed", idleOn ? "true" : "false");
        }
        syncIdleButton();
        listen(idleButton, "click", () => {
          idleOn = !idleOn;
          parallaxPlayer.setIdle(idleOn);
          syncIdleButton();
        });

        function stopPlay() {
          playing = false;
          cancelAnimationFrame(playRaf);
          if (playButton) playButton.textContent = "Play";
        }

        function demoTick(now) {
          if (!playing || !parallaxPlayer) return;
          const time = (now - playStart) / 1000;
          parallaxPlayer.setCursor(
            0.5 + 0.32 * Math.sin(time * 0.9),
            0.5 + 0.32 * Math.sin(time * 1.3 + 1.7),
          );
          playRaf = requestAnimationFrame(demoTick);
        }

        listen(playButton, "click", () => {
          if (playing) {
            stopPlay();
            return;
          }
          playing = true;
          playStart = performance.now();
          if (playButton) playButton.textContent = "Pause";
          playRaf = requestAnimationFrame(demoTick);
        });

        listen(resetButton, "click", () => {
          stopPlay();
          parallaxPlayer.reset();
          if (hint) hint.classList.remove("hidden");
        });

        parallaxCleanup = () => {
          stopPlay();
          for (const [element, type, handler] of listenerList) {
            element.removeEventListener(type, handler);
          }
          listenerList.length = 0;
        };
      }


      async function openDetail(id) {
        const request = ++detailRequest;
        state.currentId = id;
        destroyParallax();
        $("overlay").hidden = false;
        $("detail-title").textContent = "Conversion #" + id;
        $("detail-body").innerHTML = '<p class="muted">Loading…</p>';
        $("overlay").scrollTop = 0;

        let detail;
        try {
          detail = await api("/review/api/conversions/" + id);
        } catch (error) {
          if (request !== detailRequest) return;
          $("detail-body").innerHTML =
            '<div class="error-box">' + escapeHtml(error.message) + "</div>";
          return;
        }
        if (request !== detailRequest) return;

        const inputPane = detail.hasInput
          ? '<img src="/review/api/conversions/' + id + '/input" alt="input image" />'
          : '<div class="placeholder">Input image was not stored.</div>';
        const interactive = detail.status === "success" && Boolean(detail.rig);
        const outputPane =
          detail.status === "success"
            ? interactive
              ? '<div class="parallax-stage" id="parallax-stage"></div>' +
                '<div class="parallax-hint" id="parallax-hint">Move the cursor over the illustration</div>'
              : '<img src="/review/api/conversions/' + id + '/output.svg" alt="SVG output" />'
            : '<div class="placeholder">No SVG output for this conversion.</div>';
        const outputPreviewClass = interactive
          ? "preview preview-interactive"
          : "preview";
        const outputActions = interactive
          ? '<div class="preview-actions">' +
            '<button id="p-checkerboard" type="button" aria-pressed="false">Dark bg</button>' +
            '<button id="p-anchors" type="button" aria-pressed="false">Anchors</button>' +
            '<button id="p-idle" type="button" aria-pressed="true">Idle on</button>' +
            '<button id="p-play">Play</button><button id="p-reset">Reset</button></div>'

        const warnings = detail.warnings || [];
        const warningHtml = warnings.length

            warnings.map((warning) => "<li>" + escapeHtml(warning) + "</li>").join("") +

        const errorHtml = detail.errorCode
          ? '<div class="error-box"><strong>' + escapeHtml(detail.errorCode) +

        const rigWarnings =
          detail.rig && Array.isArray(detail.rig.warnings)

            : [];
        const rigDetails = detail.rig
          ? "<details><summary>Parallax rig" +
            (rigWarnings.length
              ? " · " + rigWarnings.length + " warning(s)"
              : "") +
            "</summary>" +
            (rigWarnings.length
              ? '<ul class="warnings">' +
                rigWarnings
                  .map((warning) => "<li>" + escapeHtml(warning) + "</li>")
                  .join("") +
                "</ul>"

            '<pre class="mono" id="raw-rig"></pre></details>'

        const prompt = detail.prompt || {};
        const promptText = prompt.text || "";

        $("detail-body").innerHTML =
          '<div class="meta">' +
          "<span>Request <span class=\"mono\">" + escapeHtml(detail.requestId) + "</span></span>" +
          "<span>Status " + statusBadge(detail.status) + "</span>" +
          "<span>Model <span class=\"mono\">" + escapeHtml(detail.model || "—") + "</span></span>" +
          "<span>Prompt <span class=\"mono\">" + escapeHtml(detail.promptVersion) + "</span></span>" +
          "<span>" + escapeHtml(fmtDate(detail.createdAt)) + "</span>" +
          "</div>" +
          (detail.status === "success"
            ? '<div class="rating-toolbar" id="detail-rating"><span class="muted">Publication</span>' +
              ratingButtons(detail) + "</div>"
            : "") +
          '<div class="previews">' +
          '<div><div class="preview-head"><p class="preview-label">Input sent to model</p></div>' +
          '<div class="preview">' + inputPane + "</div></div>" +
          '<div><div class="preview-head"><p class="preview-label">SVG output</p>' +
          outputActions + "</div>" +
          '<div class="' + outputPreviewClass + '">' + outputPane + "</div></div>" +
          "</div>" +
          '<div class="metrics">' +
          metric("Total latency", fmtMs(detail.latencyMs)) +
          metric("Upstream latency", fmtMs(detail.upstreamLatencyMs)) +
          metric("Attempts", fmtNum(detail.attempts)) +
          metric("Total tokens", fmtNum(detail.totalTokens)) +
          metric("Prompt tokens", fmtNum(detail.promptTokens)) +
          metric("Completion tokens", fmtNum(detail.completionTokens)) +
          metric("Cost", fmtCost(detail.costUsd)) +
          metric(
            "Cached tokens",
            detail.promptTokens > 0
              ? fmtNum(detail.cachedTokens) +
                " (" +
                Math.round((detail.cachedTokens / detail.promptTokens) * 100) +
                "%)"
              : fmtNum(detail.cachedTokens),
          ) +
          metric("Reasoning tokens", fmtNum(detail.reasoningTokens)) +
          metric("Input", detail.inputWidth ? detail.inputWidth + "×" + detail.inputHeight : "—") +
          metric("Original", detail.originalWidth ? detail.originalWidth + "×" + detail.originalHeight : "—") +
          metric("Input bytes", fmtBytes(detail.inputBytes)) +
          metric("Original bytes", fmtBytes(detail.originalBytes)) +
          metric("Downsampled", detail.downsampled ? "yes" : "no") +
          metric("SVG bytes", fmtBytes(detail.outputBytes)) +
          metric("SVG elements", fmtNum(detail.svgElements)) +
          metric("SVG paths", fmtNum(detail.svgPaths)) +
          "</div>" +
          errorHtml +
          '<details open><summary>Prompt · ' + escapeHtml(prompt.version || detail.promptVersion) +
          ' <span class="muted mono">' + escapeHtml(prompt.path || "") + "</span></summary>" +
          '<pre class="mono" id="prompt-text"></pre></details>' +
          '<details><summary>Warnings (' + warnings.length + ")</summary>" + warningHtml + "</details>" +
          '<details><summary>LLM calls</summary>' + renderCalls(detail.calls) + "</details>" +
          rigDetails +
          '<details><summary>Raw SVG</summary><pre class="mono" id="raw-svg">Loading…</pre></details>' +
          '<div class="toolbar" style="margin-top:12px">' +
          (detail.status === "success"
            ? '<a href="/review/api/conversions/' + id + '/output.svg" download="vector-' + id + '.svg">Download SVG</a>'
            : "") +
          "</div>";

        $("prompt-text").textContent = promptText;

        const rawRig = $("raw-rig");
        if (rawRig) {
          rawRig.textContent = detail.rig
            ? JSON.stringify(detail.rig, null, 2)
            : "No parallax rig.";
        }

        if (detail.status === "success") {
          fetch("/review/api/conversions/" + id + "/output.svg")
            .then((response) => response.text())
            .then((text) => {
              if (request !== detailRequest || $("overlay").hidden) return;
              const node = $("raw-svg");
              if (node) node.textContent = text;
            })
            .catch((error) => {
              if (request !== detailRequest || $("overlay").hidden) return;
              const node = $("raw-svg");
              if (node) node.textContent = "Failed to load SVG: " + error.message;
            });

          if (detail.rig) {
            fetch("/review/api/conversions/" + id + "/parallax.svg")
              .then((response) => {
                if (!response.ok) {
                  throw new Error(response.status + " " + response.statusText);
                }
                return response.text();
              })
              .then((text) => {
                if (request !== detailRequest || $("overlay").hidden) return;
                setupParallax(detail.rig, text);
              })
              .catch((error) => {
                if (request !== detailRequest || $("overlay").hidden) return;
                const stage = $("parallax-stage");
                if (!stage) return;
                const placeholder = document.createElement("div");
                placeholder.className = "parallax-placeholder";
                placeholder.textContent =
                  "Could not load the parallax preview: " + error.message;
                stage.replaceChildren(placeholder);
              });
          }
        } else {
          const node = $("raw-svg");
          if (node) node.textContent = "No SVG output.";
        }
      }

      async function navigateStep(delta) {
        if ($("overlay").hidden) return;
        const index = state.items.findIndex((item) => item.id === state.currentId);
        if (index === -1) return;

        const target = index + delta;
        if (target >= 0 && target < state.items.length) {
          return openDetail(state.items[target].id);
        }

        // Crossed a page boundary: move the list one page over, then open the edge item.
        const nextOffset = state.offset + delta * state.limit;
        if (nextOffset < 0 || nextOffset >= state.total) return;
        state.offset = nextOffset;
        const items = await loadList();
        if (!items || items.length === 0) return;
        return openDetail(delta > 0 ? items[0].id : items[items.length - 1].id);
      }

      // Serialize navigation so held/repeated arrow keys apply in order instead of racing.
      let navQueue = Promise.resolve();
      function navigate(delta) {
        navQueue = navQueue.then(() => navigateStep(delta)).catch(() => {});
        return navQueue;
      }

      async function loadStats() {
        try {
          renderStats(await api("/review/api/stats"));
        } catch (error) {
          $("stats").innerHTML =
            '<div class="card"><div class="label">Stats error</div><div class="value">' +
            escapeHtml(error.message) + "</div></div>";
        }
      }

      async function loadList() {
        const params = new URLSearchParams();
        params.set("limit", String(state.limit));
        params.set("offset", String(state.offset));
        for (const [key, value] of Object.entries(state.filters)) {
          if (value) params.set(key, value);
        }

        try {
          const data = await api("/review/api/conversions?" + params.toString());
          state.total = data.total;
          state.items = data.items;
          renderRows(data.items);
          const start = data.total === 0 ? 0 : state.offset + 1;
          const end = Math.min(state.offset + state.limit, data.total);
          $("page").textContent = start + "–" + end + " of " + data.total;
          $("prev").disabled = state.offset <= 0;
          $("next").disabled = state.offset + state.limit >= data.total;
          return data.items;
        } catch (error) {
          $("rows").innerHTML = "";
          state.items = [];
          $("empty").hidden = false;
          $("empty").textContent = "Failed to load conversions: " + error.message;
          return null;
        }
      }

      function readFilters() {
        state.filters = {
          status: $("status").value,
          rating: $("rating").value,
          model: $("model").value.trim(),
          promptVersion: $("promptVersion").value.trim(),
          q: $("q").value.trim(),
        };
      }

      $("apply").addEventListener("click", () => {
        readFilters();
        state.offset = 0;
        loadList();
      });

      $("reset").addEventListener("click", () => {
        $("status").value = "";
        $("rating").value = "";
        $("model").value = "";
        $("promptVersion").value = "";
        $("q").value = "";
        state.filters = {};
        state.offset = 0;
        loadList();
      });

      $("refresh").addEventListener("click", () => {
        loadStats();
        loadList();
        loadPublicationMeta();
      });

      $("publish").addEventListener("click", openPublish);
      $("publish-close").addEventListener("click", () => {
        $("publish-overlay").hidden = true;
      });

      $("prev").addEventListener("click", () => {
        state.offset = Math.max(0, state.offset - state.limit);
        loadList();
      });

      $("next").addEventListener("click", () => {
        state.offset += state.limit;
        loadList();
      });

      $("close").addEventListener("click", () => {
        $("overlay").hidden = true;
        destroyParallax();
      });

      $("overlay").addEventListener("click", (event) => {
        if (event.target === $("overlay")) {
          $("overlay").hidden = true;
          destroyParallax();
        }
      });

      $("publish-overlay").addEventListener("click", (event) => {
        if (event.target === $("publish-overlay")) {
          $("publish-overlay").hidden = true;
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (!$("publish-overlay").hidden) {
            $("publish-overlay").hidden = true;
            return;
          }
          $("overlay").hidden = true;
          destroyParallax();
          return;
        }
        if ($("overlay").hidden) return;
        if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;

        const tag = event.target?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || event.target?.isContentEditable) {
          return;
        }

        if (event.key === "ArrowRight") {
          event.preventDefault();
          navigate(1);
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          navigate(-1);
        }
      });

      loadStats();
      loadList();
      loadPublicationMeta();
    </script>
  </body>
</html>

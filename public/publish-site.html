<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="<!--DESCRIPTION-->" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title><!--TITLE--></title>
    <link rel="stylesheet" href="./publish.css" />
  </head>
  <body>
    <header class="site-head"><!--HERO--></header>

    <main id="results"><!--SECTIONS--></main>

    <footer class="site-foot"><!--BUILD_META--></footer>

    <dialog id="viewer" aria-labelledby="viewer-title">
      <div class="viewer-shell">
        <header class="viewer-head">
          <div>
            <span class="badge" id="viewer-rating"></span>
            <h2 id="viewer-title">Result</h2>
            <p class="viewer-meta muted" id="viewer-meta"></p>
          </div>
          <button class="icon-button" id="viewer-close" type="button" aria-label="Close">×</button>
        </header>
        <div class="viewer-body">
          <div class="stage-wrap">
            <div class="stage" id="viewer-stage"></div>
            <div class="viewer-thumb">
              <img id="viewer-input" alt="" />
              <span>Input</span>
            </div>
            <div class="viewer-status" id="viewer-status" hidden></div>
          </div>
        </div>
        <footer class="viewer-foot">
          <button id="viewer-prev" type="button" aria-label="Previous result">←</button>
          <span class="muted" id="viewer-count"></span>
          <button id="viewer-next" type="button" aria-label="Next result">→</button>
          <span class="spacer"></span>
          <button
            id="viewer-tilt"
            class="tilt-toggle"
            type="button"
            aria-label="Toggle gyroscope control"
            aria-pressed="false"
            title="Toggle gyroscope control"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <circle cx="12" cy="12" r="8.5"></circle>
              <ellipse cx="12" cy="12" rx="3.8" ry="8.5"></ellipse>
              <ellipse cx="12" cy="12" rx="8.5" ry="3.8" transform="rotate(45 12 12)"></ellipse>
            </svg>
          </button>
          <button id="viewer-bg" type="button">Dark bg</button>
          <span class="hint" id="viewer-hint">Move the cursor</span>
        </footer>
      </div>
    </dialog>

    <script src="./parallax-player.js" defer></script>
    <script src="./publish.js" defer></script>
  </body>
</html>

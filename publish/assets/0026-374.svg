<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <g id="subject" data-z="0.5" data-pivot="512,512" data-anim="sway" data-anim-period="3.5" data-anim-amplitude="4">
    
    <g id="head" data-z="0.6" data-pivot="300,350" data-anchor="neck" data-sockets="neck:300,350">
      
      <g id="head-base" data-z="0.55" data-pivot="300,350">
        <path d="M250 300 C 200 250, 150 350, 250 400 L 350 400 C 400 350, 350 300, 300 300 Z" fill="#4CAF50" stroke="none" stroke-width="0"/>
      </g>
      
      <g id="left-eye" data-z="0.7" data-pivot="280,330" data-anim="blink">
        
        <path id="eye-aperture" d="M280 330 C 270 320, 260 340, 280 350 C 300 360, 310 340, 300 330 Z" fill="none" stroke="none" stroke-width="0"/>
        
        <g id="eye-iris" data-z="0.65" data-pivot="280,330">
          <path d="M280 330 C 275 325, 265 335, 280 345 C 295 355, 305 345, 280 330 Z" fill="#1B5E20" stroke="none" stroke-width="0"/>
          
          <circle cx="280" cy="335" r="4" fill="#000000" data-z="0.66" id="parallax-1"/>
          
          <circle cx="285" cy="328" r="2" fill="#FFFFFF" data-z="0.75" id="parallax-2"/>
        </g>
        
        <g id="left-lash" data-z="0.72" data-pivot="280,330">
          <path d="M280 330 L 270 320 L 275 310 L 285 315 Z" fill="#1B5E20" stroke="none" stroke-width="0"/>
        </g>
      </g>
    </g>

    
    <g id="thorax" data-z="0.4" data-pivot="450,450" data-anchor="base" data-sockets="neck:300,350">
      
      <g id="thorax-base" data-z="0.35" data-pivot="450,450">
        <path d="M350 400 C 380 380, 450 380, 500 400 L 500 450 C 480 480, 400 480, 380 450 Z" fill="#66BB6A" stroke="none" stroke-width="0"/>
      </g>
      
      <g id="thorax-mid" data-z="0.45" data-pivot="450,450">
        <path d="M360 410 C 390 390, 460 390, 510 410 L 510 460 C 490 490, 410 490, 390 460 Z" fill="#81C784" stroke="none" stroke-width="0"/>
      </g>
      
      <g id="thorax-highlight" data-z="0.55" data-pivot="450,450">
        <path d="M370 415 C 400 395, 470 395, 520 415 L 520 465 C 500 495, 420 495, 400 465 Z" fill="#A5D6A7" stroke="none" stroke-width="0"/>
      </g>
    </g>

    
    <g id="abdomen" data-z="0.3" data-pivot="650,550" data-anchor="base">
      
      <g id="abdomen-base" data-z="0.25" data-pivot="650,550">
        <path d="M500 450 C 600 400, 750 450, 850 550 L 850 650 C 750 700, 600 700, 500 650 Z" fill="#388E3C" stroke="none" stroke-width="0"/>
      </g>
      
      <g id="abdomen-mid" data-z="0.35" data-pivot="650,550">
        <path d="M510 460 C 610 410, 760 460, 860 560 L 860 660 C 760 710, 610 710, 510 660 Z" fill="#4CAF50" stroke="none" stroke-width="0"/>
      </g>
    </g>

    
    <g id="antennae" data-z="0.65" data-pivot="250,300" data-anchor="head">
      
      <g id="ant-1" data-z="0.65" data-pivot="250,300">
        <path d="M250 300 L 200 250 L 150 200 L 100 150" fill="none" stroke="#388E3C" stroke-width="8" stroke-linecap="round"/>
      </g>
      
      <g id="ant-2" data-z="0.65" data-pivot="250,300">
        <path d="M250 300 L 300 250 L 350 200 L 400 150" fill="none" stroke="#388E3C" stroke-width="8" stroke-linecap="round"/>
      </g>
    </g>

    
    
    <g id="leg-f1" data-z="0.45" data-pivot="350,420" data-anchor="thorax">
      <path d="M350 420 L 320 450 L 300 500 L 330 530 L 360 500 Z" fill="#66BB6A" stroke="none" stroke-width="0"/>
    </g>
    
    <g id="leg-f2" data-z="0.4" data-pivot="450,420" data-anchor="thorax">
      <path d="M450 420 L 420 450 L 400 500 L 430 530 L 460 500 Z" fill="#66BB6A" stroke="none" stroke-width="0"/>
    </g>
    
    <g id="leg-f3" data-z="0.35" data-pivot="550,420" data-anchor="thorax">
      <path d="M550 420 L 520 450 L 500 500 L 530 530 L 560 500 Z" fill="#66BB6A" stroke="none" stroke-width="0"/>
    </g>

    
    <g id="leg-h1" data-z="0.2" data-pivot="650,450" data-anchor="abdomen">
      <path d="M650 450 L 600 500 L 550 650 L 600 700 L 650 650 Z" fill="#388E3C" stroke="none" stroke-width="0"/>
    </g>
    
    <g id="leg-h2" data-z="0.15" data-pivot="750,450" data-anchor="abdomen">
      <path d="M750 450 L 700 500 L 650 650 L 700 700 L 750 650 Z" fill="#388E3C" stroke="none" stroke-width="0"/>
    </g>
    
    <g id="leg-h3" data-z="0.1" data-pivot="850,450" data-anchor="abdomen">
      <path d="M850 450 L 800 500 L 750 650 L 800 700 L 850 650 Z" fill="#388E3C" stroke="none" stroke-width="0"/>
    </g>

  </g>
</svg>